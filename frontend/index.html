<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Force HTTPS & Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <script>
      // Force HTTPS redirect if accessed via HTTP on public hosts
      if (location.protocol === 'http:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        location.replace('https:' + window.location.href.substring(window.location.protocol.length));
      }
    </script>

    <!-- Primary SEO Meta Tags -->
    <title>CircleHub - Hyper-Local Neighborhood Communities &amp; Events</title>
    <meta name="title" content="CircleHub - Hyper-Local Neighborhood Communities &amp; Events" />
    <meta name="description" content="Connect with your neighbors on CircleHub. Discover local interest circles, host community workshops, share skills, and join neighborhood events near you." />
    <meta name="keywords" content="CircleHub, neighborhood community, local circles, neighborhood meetups, skill sharing, community events, local workshops, hyper-local social network" />
    <meta name="author" content="CircleHub Community Network" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#10b981" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://frontend-seven-black-12.vercel.app/" />

    <!-- Open Graph / Facebook / WhatsApp Social Previews -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://frontend-seven-black-12.vercel.app/" />
    <meta property="og:site_name" content="CircleHub" />
    <meta property="og:title" content="CircleHub - Hyper-Local Neighborhood Communities &amp; Events" />
    <meta property="og:description" content="Connect with your neighbors on CircleHub. Discover local interest circles, host community workshops, share skills, and join neighborhood events near you." />
    <meta property="og:image" content="https://frontend-seven-black-12.vercel.app/og-image.png" />
    <meta property="og:image:secure_url" content="https://frontend-seven-black-12.vercel.app/og-image.png" />

    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CircleHub Hyper-Local Community Network Preview" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card Previews -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Favicons and App Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
