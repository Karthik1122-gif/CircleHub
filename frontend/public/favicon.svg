<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ecfdf5" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#059669" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#emeraldGrad)" filter="url(#subtleShadow)" />
  <!-- Inner circular ring representing the "Circle" community -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" stroke-dasharray="6 4" />
  <!-- Center Leaf Motif -->
  <path d="M 50 25 C 68 25 75 42 75 58 C 75 70 65 75 50 75 C 50 63 52 50 60 40 C 48 48 44 60 44 75 C 33 74 25 67 25 55 C 25 38 35 25 50 25 Z" fill="url(#leafGrad)" />
  <!-- Leaf Stem & Vein -->
  <path d="M 50 75 C 50 56 58 42 66 36" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
</svg>
